```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROYALE – Lobby</title>

    <link rel="stylesheet" href="lobby.css">
</head>

<body>

    <!-- HEADER -->
    <header class="royale-header">

        <div class="royale-logo">
            ROYALE
        </div>

        <nav class="royale-navigation">

            <button class="nav-button" data-page="redeem">
                EINLÖSEN
            </button>

            <button class="nav-button active" data-page="home">
                SPIELEN
            </button>

            <button class="nav-button" data-page="locker">
                SPIND
            </button>

        </nav>

        <div class="royale-version">
            ALPHA
        </div>

    </header>


    <!-- HAUPTBEREICH -->
    <main class="royale-main">

        <!-- EINLÖSEN -->
        <section id="redeem" class="page">
        </section>


        <!-- HOME / SPIELEN -->
        <section id="home" class="page active">
        </section>


        <!-- SPIND -->
        <section id="locker" class="page">
        </section>

    </main>


    <!-- SCRIPTS -->
    <script src="einloesen.js"></script>
    <script src="spielen.js"></script>
    <script src="spind.js"></script>
    <script src="artikel.js"></script>
    <script src="shop.js"></script>


    <!-- NAVIGATION -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const buttons = document.querySelectorAll("[data-page]");
            const pages = document.querySelectorAll(".page");

            buttons.forEach(button => {

                button.addEventListener("click", () => {

                    const target = button.dataset.page;

                    // Alle Seiten deaktivieren
                    pages.forEach(page => {
                        page.classList.remove("active");
                    });

                    // Zielseite aktivieren
                    const targetPage = document.getElementById(target);

                    if (targetPage) {
                        targetPage.classList.add("active");
                    }

                    // Aktiven Navigation-Button markieren
                    buttons.forEach(navButton => {
                        navButton.classList.remove("active");
                    });

                    button.classList.add("active");

                });

            });

        });
    </script>

</body>
</html>
```
